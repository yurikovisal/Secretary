    <rect x="572" y="498" width="24" height="98"/><rect x="612" y="512" width="20" height="84"/>
    <rect x="698" y="504" width="26" height="92"/><rect x="738" y="520" width="22" height="76"/>
    <rect x="786" y="498" width="28" height="98"/><rect x="830" y="516" width="24" height="80"/>
