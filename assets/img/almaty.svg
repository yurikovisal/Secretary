  <!-- forested foothills -->
  <path fill="url(#alRock3)" d="M0 402 L104 372 L224 410 L338 378 L468 418 L588 380 L700 416 L820 378 L900 404 L900 474 L0 474 Z"/>

  <!-- TV tower on Kok-Tobe -->
  <g transform="translate(668 26) scale(0.62 0.94)">
    <path d="M0 44 L0 8" stroke="#c8d1da" stroke-width="1.6"/>
    <path d="M-2.4 46 L2.4 46 L4.4 92 L-4.4 92 Z" fill="#b9c3cf"/>
    <path d="M-5.4 92 L5.4 92 L7.6 140 L-7.6 140 Z" fill="#aab5c2"/>
