  <path fill="url(#alGreen)" d="M0 506 Q58 482 118 508 Q184 484 248 512 Q316 488 382 514 Q448 490 514 516 Q582 492 648 518 Q718 494 788 520 Q846 500 900 518 L900 640 L0 640 Z"/>
  <g fill="#2b361f" opacity=".9">
