<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 55 900 470" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Панорама Алматы с горами Заилийского Алатау и телебашней">
  <defs>
    <linearGradient id="alSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f6288"/>
      <stop offset=".38" stop-color="#7593b1"/>
      <stop offset=".66" stop-color="#b4ac9c"/>
      <stop offset="1" stop-color="#dcbf94"/>
    </linearGradient>
    <linearGradient id="alRock1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fa2b8"/><stop offset=".55" stop-color="#6a7c93"/><stop offset="1" stop-color="#4e5f76"/>
    </linearGradient>
    <linearGradient id="alRock2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d7f96"/><stop offset="1" stop-color="#3e4c60"/>
    </linearGradient>
    <linearGradient id="alRock3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d5c48"/><stop offset="1" stop-color="#293423"/>
    </linearGradient>
    <linearGradient id="alSnow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cdd8e4"/>
    </linearGradient>
    <linearGradient id="alCity" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0cda8"/><stop offset="1" stop-color="#8c7f68"/>
    </linearGradient>
    <linearGradient id="alGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#41512f" stop-opacity=".95"/><stop offset="1" stop-color="#1d2617"/>
    </linearGradient>
    <filter id="alCloud" x="-40%" y="-120%" width="180%" height="340%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="alHaze" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="900" height="640" fill="url(#alSky)"/>

