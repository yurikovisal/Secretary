<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Интерактивная Smart-панель в учебной аудитории">
  <defs>
    <linearGradient id="spRoom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f34"/><stop offset="1" stop-color="#14171b"/>
    </linearGradient>
    <linearGradient id="spBoard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2a52"/><stop offset=".5" stop-color="#0d3f7d"/><stop offset="1" stop-color="#071b38"/>
    </linearGradient>
    <linearGradient id="spBezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f45"/><stop offset="1" stop-color="#16191d"/>
    </linearGradient>
    <linearGradient id="spWave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39a8ff" stop-opacity=".1"/>
      <stop offset=".5" stop-color="#6cc6ff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#2d7fd6" stop-opacity=".15"/>
    </linearGradient>
    <filter id="spGlow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="880" height="500" fill="url(#spRoom)"/>
  <!-- back wall + chalkboard -->
  <rect x="0" y="60" width="880" height="300" fill="#22262b"/>
  <rect x="596" y="96" width="284" height="200" rx="4" fill="#2f4a3c"/>
  <rect x="596" y="296" width="284" height="10" fill="#4a413a"/>
  <rect x="0" y="96" width="150" height="200" rx="4" fill="#2f4a3c" opacity=".6"/>
  <!-- ceiling light -->
  <rect x="300" y="20" width="280" height="12" rx="6" fill="#e9f1f7" opacity=".35" filter="url(#spGlow)"/>
  <!-- floor -->
  <rect y="360" width="880" height="140" fill="#191d21"/>
  <rect y="360" width="880" height="6" fill="#0e1114"/>

  <!-- desks -->
  <g fill="#2c3138">
    <rect x="20" y="380" width="140" height="12" rx="3"/><rect x="30" y="392" width="8" height="60"/>
    <rect x="142" y="392" width="8" height="60"/>
    <rect x="700" y="384" width="150" height="12" rx="3"/><rect x="712" y="396" width="8" height="60"/>
    <rect x="832" y="396" width="8" height="60"/>
    <rect x="180" y="452" width="170" height="12" rx="3"/><rect x="520" y="452" width="170" height="12" rx="3"/>
  </g>

  <!-- panel stand -->
  <g fill="#22262b">
    <rect x="404" y="382" width="72" height="100"/>
    <rect x="330" y="476" width="220" height="14" rx="7"/>
    <rect x="352" y="490" width="24" height="10"/><rect x="504" y="490" width="24" height="10"/>
  </g>

  <!-- display -->
  <g>
    <rect x="196" y="46" width="488" height="336" rx="12" fill="url(#spBezel)"/>
    <rect x="208" y="58" width="464" height="292" rx="4" fill="url(#spBoard)"/>
    <!-- camera bar -->
    <rect x="392" y="40" width="96" height="10" rx="5" fill="#101317"/>
    <circle cx="440" cy="45" r="2.4" fill="#4a5158"/>
    <!-- waves -->
    <g fill="none" stroke="url(#spWave)">
      <path d="M212 214 Q300 150 388 196 Q476 242 564 172 Q628 122 668 146" stroke-width="16" opacity=".55"/>
      <path d="M212 232 Q302 168 392 214 Q482 260 570 190 Q630 142 668 166" stroke-width="9" opacity=".75"/>
      <path d="M212 250 Q304 190 396 234 Q488 278 574 210 Q634 164 668 188" stroke-width="4" opacity=".9"/>
      <path d="M212 268 Q306 212 400 254 Q494 296 578 230 Q636 186 668 210" stroke-width="2" opacity=".7"/>
    </g>
    <!-- clock block -->
    <text x="560" y="150" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="34" fill="#eef5fb" letter-spacing=".5">Smart SSP</text>
    <text x="560" y="212" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="42" font-weight="300" fill="#f4f9fd">10:30</text>
    <text x="560" y="234" text-anchor="middle" font-family="Manrope, Segoe UI, sans-serif" font-size="11" fill="#b8cee3">Ср, 22 мая</text>
    <!-- dock -->
    <g>
      <g transform="translate(258 288)">
        <rect width="34" height="34" rx="9" fill="#e8a13c"/><rect x="9" y="9" width="16" height="16" rx="4" fill="#fff" opacity=".85"/>
      </g>
      <g transform="translate(310 288)">
        <rect width="34" height="34" rx="9" fill="#2f9fd8"/><circle cx="17" cy="17" r="8" fill="#fff" opacity=".85"/>
      </g>
      <g transform="translate(362 288)">
        <rect width="34" height="34" rx="9" fill="#3b7fd4"/><rect x="10" y="10" width="14" height="14" rx="7" fill="#fff" opacity=".85"/>
      </g>
      <g transform="translate(414 288)">
        <rect width="34" height="34" rx="9" fill="#e6b64a"/><path d="M10 24 L17 10 L24 24 Z" fill="#fff" opacity=".85"/>
      </g>
      <g transform="translate(466 288)">
        <rect width="34" height="34" rx="9" fill="#5aa9e0"/><rect x="9" y="12" width="16" height="11" rx="3" fill="#fff" opacity=".85"/>
      </g>
    </g>
    <g fill="#c9dcec" font-family="Manrope, Segoe UI, sans-serif" font-size="6" text-anchor="middle" opacity=".8">
      <text x="275" y="332">Рисование</text><text x="327" y="332">Браузер</text>
      <text x="379" y="332">Галерея</text><text x="431" y="332">Файлы</text><text x="483" y="332">Помощь</text>
    </g>
    <!-- corner control -->
    <g transform="translate(628 96)" opacity=".8">
      <circle r="12" fill="none" stroke="#9dc4e4" stroke-width="1.5"/>
      <circle r="5" fill="#9dc4e4"/>
    </g>
    <!-- lower bar -->
    <rect x="196" y="352" width="488" height="30" rx="6" fill="#1a1e23"/>
    <rect x="330" y="363" width="90" height="7" rx="3.5" fill="#e8a13c"/>
    <rect x="242" y="363" width="60" height="7" rx="3.5" fill="#3a4149"/>
    <rect x="452" y="363" width="60" height="7" rx="3.5" fill="#3a4149"/>
  </g>

  <!-- screen glow on room -->
  <ellipse cx="440" cy="220" rx="360" ry="220" fill="#3f8fd6" opacity=".07" filter="url(#spGlow)"/>
  <rect width="880" height="500" fill="#050708" opacity=".22"/>
</svg>
